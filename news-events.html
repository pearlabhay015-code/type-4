<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-en="News & Events — CUSB" data-hi="समाचार और कार्यक्रम — सीयूएसबी">News & Events — CUSB</title>
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/pages.css">
  <style>
    .news-events-filter {
      margin-bottom: 30px;
    }
    .announcements-container {
      display: grid;
      grid-template-columns: 1fr;
      gap: 25px;
      margin-top: 30px;
    }
    .announcement-full-card {
      background: var(--bg-primary);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 24px;
      display: flex;
      gap: 24px;
      box-shadow: var(--shadow-sm);
      transition: var(--transition);
    }
    .announcement-full-card:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-md);
      border-color: var(--acc-gold);
    }
    .announcement-img-wrap {
      width: 220px;
      height: 140px;
      border-radius: 8px;
      overflow: hidden;
      flex-shrink: 0;
      border: 1px solid var(--border-color);
    }
    .announcement-img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .announcement-info {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      flex-grow: 1;
    }
    .announcement-meta {
      display: flex;
      gap: 15px;
      font-size: 0.75rem;
      color: var(--tx-muted);
      text-transform: uppercase;
      font-weight: 700;
      margin-bottom: 8px;
    }
    .announcement-tag {
      color: var(--acc-coral);
    }
    .announcement-title {
      font-family: var(--ff-title);
      font-size: 1.3rem;
      color: var(--tx-primary);
      margin-bottom: 10px;
    }
    .announcement-desc {
      font-size: 0.88rem;
      color: var(--tx-muted);
      line-height: 1.6;
      margin-bottom: 15px;
    }
    .loading-spinner {
      text-align: center;
      padding: 50px 0;
      font-size: 1.2rem;
      color: var(--tx-muted);
    }
    @media (max-width: 768px) {
      .announcement-full-card {
        flex-direction: column;
        gap: 16px;
      }
      .announcement-img-wrap {
        width: 100%;
        height: 180px;
      }
    }
  </style>
</head>
<body>
  <a href="#mainContent" class="skip-link" data-en="Skip to main content" data-hi="मुख्य सामग्री पर जाएँ">Skip to main content</a>

  <cusb-ticker></cusb-ticker>
  <cusb-topbar></cusb-topbar>
  <cusb-header></cusb-header>
  <cusb-accessibility-bar></cusb-accessibility-bar>
  <cusb-navbar></cusb-navbar>

  <main id="mainContent">
    <!-- ══════ HERO BANNER ══════ -->
    <section class="admin-hero" aria-label="News Banner">
      <div class="container hero-content">
        <div class="hero-eyebrow">
          <span data-en="Notice Board & Updates" data-hi="सूचना पट्ट और अपडेट">Notice Board & Updates</span>
        </div>
        <h1 class="hero-title" data-en="News & <span>Events</span>" data-hi="समाचार और <span>कार्यक्रम</span>">News & <span>Events</span></h1>
        <p class="hero-sub" data-en="Stay updated with the latest notices, circulars, research press releases, and campus activities at CUSB." data-hi="सीयूएसबी की नवीनतम सूचनाओं, परिपत्रों, अनुसंधान प्रेस विज्ञप्तियों और परिसर की गतिविधियों से अपडेट रहें।">Stay updated with the latest notices, circulars, research press releases, and campus activities at CUSB.</p>
      </div>
    </section>

    <!-- ══════ NEWS & EVENTS GRID ══════ -->
    <section class="section">
      <div class="container">
        <!-- Interactive Tabs -->
        <div class="school-tab-bar news-events-filter" id="filterTabBar" role="tablist" aria-label="Filter Announcements" style="flex-wrap: wrap; gap: 8px;">
          <button class="btn-school-tab active" data-filter="all" role="tab" aria-selected="true" data-en="All Announcements" data-hi="सभी घोषणाएं">All Announcements</button>
          <button class="btn-school-tab" data-filter="news" role="tab" aria-selected="false" data-en="Latest News" data-hi="नवीनतम समाचार">Latest News</button>
          <button class="btn-school-tab" data-filter="event" role="tab" aria-selected="false" data-en="Upcoming Events" data-hi="आगामी कार्यक्रम">Upcoming Events</button>
          <button class="btn-school-tab" data-filter="circular" role="tab" aria-selected="false" data-en="Circulars" data-hi="परिपत्र (Circulars)">Circulars</button>
          <button class="btn-school-tab" data-filter="date" role="tab" aria-selected="false" data-en="Important Dates" data-hi="महत्वपूर्ण तिथियां">Important Dates</button>
          <button class="btn-school-tab" data-filter="ticker" role="tab" aria-selected="false" data-en="General Notices" data-hi="सामान्य सूचनाएं">General Notices</button>
          <button class="btn-school-tab" data-filter="archive" role="tab" aria-selected="false" data-en="Archived Updates" data-hi="अभिलेखागार">Archived Updates</button>
        </div>

        <!-- Dynamic Content Area -->
        <div id="announcementsList" class="announcements-container">
          <div class="loading-spinner" data-en="Loading updates from server..." data-hi="सर्वर से अपडेट लोड हो रहे हैं...">Loading updates from server...</div>
        </div>
      </div>
    </section>
  </main>

  <cusb-footer></cusb-footer>
  <cusb-chatbot></cusb-chatbot>

  <script src="js/components.js" defer></script>
  <script src="js/main.js" defer></script>
  
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const listContainer = document.getElementById('announcementsList');
      const tabs = document.querySelectorAll('#filterTabBar .btn-school-tab');
      let allAnnouncements = [];

      // Check query parameter 'type' for initial filter
      const params = new URLSearchParams(window.location.search);
      let activeFilter = params.get('type') || 'all';
      
      const tabToActivate = Array.from(tabs).find(t => t.getAttribute('data-filter') === activeFilter);
      if (tabToActivate) {
        tabs.forEach(t => t.classList.remove('active'));
        tabToActivate.classList.add('active');
      }

      async function fetchAnnouncements() {
        allAnnouncements = [];
        try {
          let url = window.cusbApiUrl('announcements');
          if (activeFilter === 'archive') {
            url += '?archive=true';
          }
          const response = await fetch(url);
          if (response.ok) {
            allAnnouncements = await response.json();
          }
        } catch (error) {
          console.log("Backend offline, reading local storage announcements");
        }

        const stored = localStorage.getItem('cusb_announcements');
        if (stored) {
          try {
            const localArr = JSON.parse(stored);
            if (localArr && localArr.length > 0) {
              const now = Date.now();
              localArr.forEach(item => {
                if (!item.expiry_timestamp || item.expiry_timestamp === 0 || item.expiry_timestamp > now) {
                  if (!allAnnouncements.some(a => a.id === item.id)) {
                    allAnnouncements.unshift(item);
                  }
                }
              });
            }
          } catch(e) {}
        }

        renderAnnouncements(activeFilter);
      }

      function renderAnnouncements(filter) {
        let filtered = allAnnouncements;
        if (filter !== 'all') {
          // Normalize type filter
          filtered = allAnnouncements.filter(item => {
            const itemType = item.type.toLowerCase();
            if (filter === 'news') return itemType === 'news' || itemType === 'latest news';
            if (filter === 'event') return itemType === 'event' || itemType === 'upcoming events' || itemType === 'events';
            if (filter === 'circular') return itemType === 'circular' || itemType === 'circulars';
            if (filter === 'date') return itemType === 'date' || itemType === 'dates' || itemType === 'important dates';
            if (filter === 'archive') return true; // Server-side filters already applied
            return itemType === filter;
          });
        }

        if (filtered.length === 0) {
          listContainer.innerHTML = `<div class="loading-spinner" data-en="No updates found in this category." data-hi="इस श्रेणी में कोई अपडेट नहीं मिला।">No updates found in this category.</div>`;
          applyLangToContainer();
          return;
        }

        listContainer.innerHTML = '';
        filtered.forEach(item => {
          const card = document.createElement('article');
          card.className = 'announcement-full-card';
          
          const defaultImage = item.type.toLowerCase().includes('event') ? 'assets/images/audimg.jpg' : 'assets/images/blockB.jpg';
          const imgUrl = item.image_url || defaultImage;
          const displayDate = item.date_str || new Date(item.created_at).toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' });
          const categoryLabel = item.type.toUpperCase();

          card.innerHTML = `
            <div class="announcement-img-wrap">
              <img src="${imgUrl}" alt="${item.title_en}" onerror="this.src='assets/images/blockB.jpg'">
            </div>
            <div class="announcement-info">
              <div>
                <div class="announcement-meta">
                  <span class="announcement-tag">${categoryLabel}</span>
                  <span class="announcement-date">${displayDate}</span>
                </div>
                <h3 class="announcement-title" data-en="${item.title_en}" data-hi="${item.title_hi}">${item.title_en}</h3>
                <p class="announcement-desc" data-en="${item.desc_en}" data-hi="${item.desc_hi}">${item.desc_en}</p>
              </div>
            </div>
          `;
          listContainer.appendChild(card);
        });

        applyLangToContainer();
      }

      function applyLangToContainer() {
        const lang = localStorage.getItem('cusb-lang') || 'en';
        listContainer.querySelectorAll('[data-en], [data-hi]').forEach(el => {
          const txt = el.getAttribute(`data-${lang}`);
          if (txt) el.textContent = txt;
        });
      }

      // Tab click events
      tabs.forEach(tab => {
        tab.addEventListener('click', () => {
          const prevFilter = activeFilter;
          tabs.forEach(t => {
            t.classList.remove('active');
            t.setAttribute('aria-selected', 'false');
          });
          tab.classList.add('active');
          tab.setAttribute('aria-selected', 'true');
          activeFilter = tab.getAttribute('data-filter');
          
          if (activeFilter === 'archive' || prevFilter === 'archive') {
            fetchAnnouncements();
          } else {
            renderAnnouncements(activeFilter);
          }
        });
      });

      // Fetch on load
      fetchAnnouncements();
      window.setInterval(fetchAnnouncements, 30000);

      // Listen to language changes
      window.addEventListener('storage', (e) => {
        if (e.key === 'cusb-lang') {
          renderAnnouncements(activeFilter);
        }
      });
      // Monitor language clicks (custom listener or just poll language attribute)
      const observer = new MutationObserver(() => {
        renderAnnouncements(activeFilter);
      });
      observer.observe(document.documentElement, { attributes: true, attributeFilter: ['lang'] });
    });
  </script>
</body>
</html>
