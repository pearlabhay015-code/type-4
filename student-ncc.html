  <link rel="icon" href="assets/culog.png">
  <meta name="description" content="National Cadet Corps (NCC) Unit at Central University of South Bihar. Training youth in discipline, leadership, and national service.">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/pages.css">
  <style>
    .ncc-page-wrapper {
      padding: 24px 0 64px;
      min-height: calc(100vh - 200px);
    }
    .ncc-crumb {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 0.84rem;
      color: var(--tx-muted);
      margin-bottom: 20px;
    }
    .ncc-crumb a {
      color: var(--tx-muted);
      text-decoration: none;
    }
    .ncc-crumb a:hover {
      color: var(--acc-blue);
    }

    /* 2-Column Layout with Side Menu */
    .ncc-layout {
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 32px;
      align-items: start;
    }
    @media (max-width: 960px) {
      .ncc-layout {
        grid-template-columns: 1fr;
      }
    }

    /* Left Side Menu */
    .ncc-sidebar {
      position: sticky;
      top: 120px;
    }
    .ncc-menu-card {
      background: var(--bg-primary);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
    }
    .ncc-menu-header {
      background: #00569b;
      color: #ffffff;
      padding: 14px 18px;
      font-size: 1.05rem;
      font-weight: 800;
      letter-spacing: 0.02em;
    }
    [data-theme="dark"] .ncc-menu-header {
      background: #0284c7;
    }
    .ncc-menu-list {
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      list-style: none;
      margin: 0;
    }
    .ncc-menu-btn {
      display: block;
      width: 100%;
      padding: 11px 16px;
      background: #0b6cb8;
      color: #ffffff !important;
      font-size: 0.92rem;
      font-weight: 700;
      text-align: center;
      border-radius: 6px;
      text-decoration: none;
      box-shadow: 0 2px 6px rgba(11, 108, 184, 0.25);
      transition: all 0.2s ease;
      line-height: 1.35;
    }
    .ncc-menu-btn:hover {
      background: #004b9b;
      transform: translateY(-2px);
      box-shadow: 0 6px 14px rgba(11, 108, 184, 0.35);
    }
    .ncc-menu-btn.active {
      background: #004b9b;
      box-shadow: inset 0 0 0 2px #ffd950;
    }
    [data-theme="dark"] .ncc-menu-btn {
      background: #0284c7;
    }
    [data-theme="dark"] .ncc-menu-btn:hover {
      background: #38bdf8;
      color: #0f172a !important;
    }
    [data-theme="dark"] .ncc-menu-btn.active {
      background: #38bdf8;
      color: #0f172a !important;
    }

    /* Main Content Styling */
    .ncc-header-area {
      margin-bottom: 20px;
    }
    .ncc-main-title {
      font-size: 2.1rem;
      font-weight: 800;
      color: #0b6cb8;
      margin: 0 0 10px;
      letter-spacing: -0.02em;
      border-bottom: 2px dashed rgba(11, 108, 184, 0.3);
      padding-bottom: 10px;
    }
    [data-theme="dark"] .ncc-main-title {
      color: #38bdf8;
      border-bottom-color: rgba(56, 189, 248, 0.3);
    }

    .ncc-sub-heading {
      font-size: 1.45rem;
      font-weight: 700;
      color: var(--tx-primary);
      margin: 20px 0 16px;
    }

    .ncc-nav-links-list {
      list-style: disc;
      padding-left: 24px;
      margin: 0 0 24px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .ncc-nav-links-list li a {
      color: #0b6cb8;
      font-size: 1.02rem;
      font-weight: 700;
      text-decoration: none;
      transition: color 0.15s ease;
    }
    .ncc-nav-links-list li a:hover {
      color: #004b9b;
      text-decoration: underline;
    }
    [data-theme="dark"] .ncc-nav-links-list li a {
      color: #38bdf8;
    }
  </style>
</head>
