<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title data-en="NCC Gallery — National Cadet Corps — Central University of South Bihar" data-hi="एनसीसी गैलरी — दक्षिण बिहार केंद्रीय विश्वविद्यालय">NCC Gallery — CUSB</title>
  <link rel="icon" href="assets/culog.png">
  <meta name="description" content="National Cadet Corps (NCC) Photo & Video Gallery at Central University of South Bihar. Swachhata drives, training camps, bicycle rallies, and achievements.">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/pages.css">
  <style>
    .ncc-page-wrapper {
      padding: 24px 0 64px;
      min-height: calc(100vh - 200px);
    }
    .ncc-crumb {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 0.84rem;
      color: var(--tx-muted);
      margin-bottom: 20px;
    }
    .ncc-crumb a {
      color: var(--tx-muted);
      text-decoration: none;
    }
    .ncc-crumb a:hover {
      color: var(--acc-blue);
    }

    /* 2-Column Layout with Side Menu */
    .ncc-layout {
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 32px;
      align-items: start;
    }
    @media (max-width: 960px) {
      .ncc-layout {
        grid-template-columns: 1fr;
      }
    }

    /* Left Side Menu */
    .ncc-sidebar {
      position: sticky;
      top: 120px;
    }
    .ncc-menu-card {
      background: var(--bg-primary);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
    }
    .ncc-menu-header {
      background: #00569b;
      color: #ffffff;
      padding: 14px 18px;
      font-size: 1.05rem;
      font-weight: 800;
      letter-spacing: 0.02em;
    }
    [data-theme="dark"] .ncc-menu-header {
      background: #0284c7;
    }
    .ncc-menu-list {
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      list-style: none;
      margin: 0;
    }
    .ncc-menu-btn {
      display: block;
      width: 100%;
      padding: 11px 16px;
      background: #0b6cb8;
      color: #ffffff !important;
      font-size: 0.92rem;
      font-weight: 700;
      text-align: center;
      border-radius: 6px;
      text-decoration: none;
      box-shadow: 0 2px 6px rgba(11, 108, 184, 0.25);
      transition: all 0.2s ease;
      line-height: 1.35;
    }
    .ncc-menu-btn:hover {
      background: #004b9b;
      transform: translateY(-2px);
      box-shadow: 0 6px 14px rgba(11, 108, 184, 0.35);
    }
    .ncc-menu-btn.active {
      background: #004b9b;
      box-shadow: inset 0 0 0 2px #ffd950;
    }
    [data-theme="dark"] .ncc-menu-btn {
      background: #0284c7;
    }
    [data-theme="dark"] .ncc-menu-btn:hover {
      background: #38bdf8;
      color: #0f172a !important;
    }
    [data-theme="dark"] .ncc-menu-btn.active {
      background: #38bdf8;
      color: #0f172a !important;
    }

    /* Main Content Styling */
    .ncc-header-area {
      margin-bottom: 20px;
    }
    .ncc-main-title {
      font-size: 2rem;
      font-weight: 800;
      color: #0b6cb8;
      margin: 0 0 10px;
      letter-spacing: -0.02em;
      border-bottom: 2px dashed rgba(11, 108, 184, 0.3);
      padding-bottom: 10px;
    }
    [data-theme="dark"] .ncc-main-title {
      color: #38bdf8;
      border-bottom-color: rgba(56, 189, 248, 0.3);
    }

    .ncc-section-title {
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--tx-primary);
      margin: 24px 0 14px;
    }

    /* YouTube Video Link Cards */
    .yt-links-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 14px;
      margin-bottom: 28px;
    }
    .yt-link-card {
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: #0b6cb8 !important;
      font-weight: 700;
      font-size: 0.88rem;
      box-shadow: var(--shadow-sm);
      transition: all 0.2s ease;
      word-break: break-all;
    }
    .yt-link-card:hover {
      background: rgba(220, 38, 38, 0.08);
      border-color: #dc2626;
      color: #dc2626 !important;
      transform: translateY(-2px);
    }
    .yt-icon {
      color: #dc2626;
      font-size: 1.3rem;
      flex-shrink: 0;
    }

    /* 2-Column Gallery Grid with Big Image Boxes */
    .ncc-gallery-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      margin-top: 16px;
    }
    @media (max-width: 768px) {
      .ncc-gallery-grid {
        grid-template-columns: 1fr;
      }
    }

    .ncc-gallery-card {
      background: var(--bg-primary);
      border: 1.5px solid var(--border-color);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
      transition: transform 0.22s ease, box-shadow 0.22s ease;
      display: flex;
      flex-direction: column;
    }
    .ncc-gallery-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.15);
      border-color: #0b6cb8;
    }
    .ncc-gallery-img-wrap {
      width: 100%;
      min-height: 280px;
      max-height: 440px;
      overflow: hidden;
      background: #f8fafc;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    [data-theme="dark"] .ncc-gallery-img-wrap {
      background: #0f172a;
    }
    .ncc-gallery-img {
      width: 100%;
      height: 100%;
      max-height: 440px;
      object-fit: contain;
      display: block;
      transition: transform 0.3s ease;
    }
    .ncc-gallery-card:hover .ncc-gallery-img {
      transform: scale(1.02);
    }
  </style>
</head>
